<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wins Log 小岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand plank">
    <svg class="brand-star" viewBox="0 0 7 7" aria-hidden="true"><use href="#px-star"/></svg>
    <h1><span class="latin">Wins Log</span><span class="cn" data-i18n="brand.island">小岛</span></h1>
  </div>

  <div class="date-sign plank" data-i18n-aria="date.aria">
    <span class="date-main" id="date-main"></span>
    <span class="date-week" id="date-week"></span>
  </div>

  <nav class="tabs" data-i18n-aria="tabs.aria">
    <button class="tab is-active" data-view="island" type="button" data-i18n="tab.island">🏝 我的小岛</button>
    <button class="tab" data-view="map" type="button" data-i18n="tab.map">🗺 世界地图</button>
    <button class="tab lang-toggle" id="lang-toggle" type="button" data-i18n-aria="lang.aria">
      <span data-lang="zh">中</span><span class="lang-sep">/</span><span data-lang="en">EN</span>
    </button>
  </nav>
</header>

<!-- ============ 小岛主页 ============ -->
<main class="view view-island" id="view-island">

  <section class="panel tasks" aria-labelledby="tasks-title">
    <h2 id="tasks-title" class="panel-title" data-i18n="tasks.title">今日任务</h2>

    <form class="task-entry" id="task-form" autocomplete="off">
      <input type="text" id="task-input" maxlength="200" data-i18n-placeholder="tasks.placeholder" data-i18n-aria="tasks.inputAria">
      <button class="pixel-btn" type="submit" data-i18n="tasks.add">种下</button>
    </form>

    <ul class="todo" id="todo"></ul>
    <p class="empty" id="todo-empty" data-i18n="tasks.empty"></p>

    <div class="divider" aria-hidden="true"></div>

    <h3 class="sub-title">
      <span data-i18n="wins.title">今天的 Wins</span>
      <span class="count-badge"><b id="win-count">0</b> <span data-i18n="wins.unit">件</span></span>
    </h3>
    <ol class="wins" id="wins"></ol>
    <p class="empty" id="wins-empty" data-i18n="wins.empty"></p>

    <div class="panel-foot">
      <button class="pixel-btn pixel-btn--warm" id="end-day" type="button" data-i18n="endDay">🖨 结束今天</button>
    </div>
  </section>

  <section class="panel island" aria-labelledby="island-title">
    <h2 id="island-title" class="panel-title" data-i18n="island.title">我的小岛</h2>
    <div class="island-frame">
      <canvas id="island" width="128" height="80" data-i18n-aria="island.aria"></canvas>
      <div class="island-tip" id="island-tip" hidden></div>
    </div>
    <p class="caption" id="island-caption" aria-live="polite"></p>
  </section>

  <section class="panel helper" aria-labelledby="helper-title">
    <div class="helper-head">
      <h2 id="helper-title" class="panel-title" data-i18n="helper.title">小岛助手</h2>
      <span class="mode-tag" id="ai-mode" data-i18n="helper.mode" data-i18n-title="helper.modeTitle">练习模式</span>
    </div>

    <div class="chat-log" id="chat-log" aria-live="polite"></div>

    <div class="chips" id="chat-chips">
      <button type="button" class="chip" data-chip="plan" data-i18n="chip.plan"></button>
      <button type="button" class="chip" data-chip="done" data-i18n="chip.done"></button>
      <button type="button" class="chip" data-chip="stuck" data-i18n="chip.stuck"></button>
    </div>

    <form class="task-entry chat-entry" id="chat-form" autocomplete="off">
      <input type="text" id="chat-input" maxlength="300" data-i18n-placeholder="chat.placeholder" data-i18n-aria="chat.inputAria">
      <button class="pixel-btn pixel-btn--icon" id="chat-mic" type="button" data-i18n-aria="chat.mic" data-i18n-title="chat.micTitle">🎙</button>
      <button class="pixel-btn" type="submit" data-i18n="chat.send">发送</button>
    </form>
    <p class="soon" id="chat-hint" data-i18n="chat.hint"></p>
  </section>

</main>

<!-- ============ 世界地图 ============ -->
<main class="view view-map" id="view-map" hidden>
  <section class="panel map-panel" aria-labelledby="map-title">
    <div class="helper-head">
      <h2 id="map-title" class="panel-title" data-i18n="map.title">世界地图</h2>
      <span class="mode-tag" data-i18n="map.tag" data-i18n-title="map.tagTitle">示例留言</span>
    </div>
    <p class="map-intro" data-i18n="map.intro"></p>
    <div class="world-frame">
      <div class="world-wrap" id="world-wrap">
        <canvas id="world" width="160" height="80" aria-hidden="true"></canvas>
        <div class="world-notes" id="world-notes" aria-live="polite"></div>
      </div>
    </div>
    <!-- 窄屏时，纸条排在地图下面，不挡住地图 -->
    <div class="world-notes-below" id="world-notes-below" aria-live="polite"></div>
  </section>
</main>

<!-- ============ 结束今天：小打印机 ============ -->
<div class="modal" id="printer-modal" role="dialog" aria-modal="true" aria-labelledby="printer-status" hidden>
  <div class="printer-stage">
    <div class="printer" id="printer" aria-hidden="true">
      <div class="printer-top"></div>
      <div class="printer-body">
        <span class="printer-led"></span>
        <span class="printer-label">WINS · PRINTER</span>
        <span class="printer-slot"></span>
      </div>
    </div>
    <div class="receipt-slot" id="receipt-slot"></div>
    <p class="printer-status" id="printer-status" aria-live="polite"></p>
    <div class="printer-actions" id="printer-actions" hidden>
      <button class="pixel-btn" id="receipt-save" type="button" data-i18n="printer.save">💾 保存成图片</button>
      <button class="pixel-btn pixel-btn--icon" id="receipt-close" type="button" data-i18n="printer.close">关闭</button>
    </div>
  </div>
</div>

<footer class="footnote" data-i18n="footnote"></footer>

<!-- 共用像素小图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="px-star" viewBox="0 0 7 7" shape-rendering="crispEdges">
    <path fill="currentColor" d="M3 0h1v2h1v1h2v1h-2v1h-1v2h-1v-2h-1v-1h-2v-1h2v-1h1z"/>
  </symbol>
</svg>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/island.js"></script>
<script src="js/tasks.js"></script>
<script src="js/receipt.js"></script>
<script src="js/ai.js"></script>
<script src="js/chat.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
